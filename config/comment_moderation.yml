comment_moderation:
  disabled: false
  report_threshold: 3

  lexicon:
    provider: go_swd
    use_builtin: true
    strict_builtin_match: true
    custom_words:
      block: {}
      review: {}

  structure_rules:
    url:
      level: review
    decoded_url:
      level: review
    contact:
      level: review
    script_injection:
      level: block
    text_quality:
      level: review
    risk_phrase:
      level: review

