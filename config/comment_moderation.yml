  behavior_rules:
    user_frequency:
      window_seconds: 600
      review_threshold: 6
    ip_frequency:
      window_seconds: 600
      review_threshold: 12
    duplicate_content:
      window_seconds: 86400
      review_threshold: 2
      block_threshold: 4

  decision:
    default_on_error: pending
    score:
      pending: 40
      reject: 80
    category_overrides:
      sexual:
        level: block
      gambling:
        level: block
      drugs:
        level: block
      political:
        level: review
      violence:
        level: review
      abuse:
