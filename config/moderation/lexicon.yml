  structure_rules:
    url:
      level: review
    decoded_url:
      level: review
    contact:
      level: review
    script_injection:
      level: block
    text_quality:
      level: review
    risk_phrase:
      level: review

  structure_patterns:
    # URL 与联系方式的基础语法配置。正则由策略编译器预校验并在进程内缓存。
    # 域名后缀或新的联系方式代称只在这里维护；脚本注入和手机号基础语法保留为不可关闭的安全规则。
    url_patterns:
      - '(?i)(https?\s*:\s*/\s*/|www\s*\.|[\p{Han}a-z0-9][\p{Han}a-z0-9._-]*\s*\.\s*(com|cn|net|org|top|xyz|shop|vip|cc|io|me)\b)'
      - '(?i)(hxxps?\s*:\s*/\s*/|[a-z0-9-]+\s*(点|\[\s*\.\s*\])\s*(com|cn|net|org|top|xyz|shop|vip|cc|io|me)\b)'
    contact_patterns:
      - '(?i)(加|群|qq|vx|v信|微信|筘|扣|抠|薇|威|扫码|二维码|企鹅群)[^\n]{0,12}\d[\d\s]{4,}|(\b(v|vx|qq)\b|微信|微信号|v信)\s*[:：]\s*[a-z0-9_-]{4,}|(\b(v|vx|qq)\b|微信|微信号|v信)\s*[:：]\s*(?:[a-z0-9][\s_-]*){4,}'
      - '(?i)(加\s*(微信|vx|v信|qq|群|好友|筘|扣|抠|薇|威)|v我|联系\s*我|私信|进群|扫码|二维码|绿泡泡|绿信|微信号|账号写图片|联系方式)'
      - '(?i)\b[a-z0-9._%+-]+\s+at\s+[a-z0-9.-]+\s+dot\s+[a-z]{2,}\b'
    negated_contact_markers: [不包含联系方式, 没有联系方式, 不留联系方式, 无需联系方式]
    benign_contact_patterns:
      - '联系方式(识别)?测试'
      - '(不要把.{0,24}当成违规|别把.{0,24}判违规|正常讨论.{0,24}误杀)'
      - '(测试数据|测试号码|示例账号|正则|反垃圾样本).{0,32}(微信|账号|手机号|号码|邮件|\sat\s)'

    # 异常文本质量阈值。比例范围为 0~1；过低会把正常短评论误判为 text_quality。
    min_numeric_runes: 5
    min_repeated_runes: 6
    number_like_ratio: 0.60
    repeated_ratio: 0.75
    min_account_token_runes: 4

