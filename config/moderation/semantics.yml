    # 关系分析词汇表。字段名是算法约定，内容可以随中文表达覆盖持续演进。
    # 不要把具体业务对象（例如“毕业设计”）放进这里；业务对象属于 concept_sets 或领域规则包。
    relation_vocabulary:
      negation_markers: [不要, 不用, 不需要, 无需, 不能, 不可, 不是, 禁止, 拒绝, 没有]
      immediate_negation_markers: [别, 勿, 不, 没, 未]
      actors: [我这边, 我们, 本人, 商家, 店主, 对方, 有人, 我, 他, 她]
      person_targets: [这个人, 这人, 作者, 博主, 楼主, 你们, 他们, 她们, 你, 您, 他, 她]
      content_targets: [这种内容, 这个内容, 这种教程, 这个教程, 这篇文章, 这段代码, 这种逻辑, 这个结论, 这种错误, 这篇东西, 这种东西, 内容, 教程, 文章, 代码, 结论, 逻辑, 错误, 观点]
      result_connectors: [导致, 造成, 以致, 从而, 直到, 结果, 保证, 包过, 让]
      promotion_actions: [接单, 接活, 承接, 可以做, 能做, 代做, 提供, 出售, 私聊, 联系]
      # 这些泛词单独出现时不足以证明“引用/报道”，必须与更强的上下文标记共同判断。
      weak_reporting_markers: [审核, 规范, 讨论, 说明, 分析, 研究, 批评, 测试, 培训, 治理, 公告, 统计, 调查, 字段]
      interrogative_prefixes: [是不是, 是不是有, 是不是个, 是否, 是否有, 是否是]
      question_markers: [什么意思, 是什么, 指什么, 怎么理解, 如何理解, 是否代表, 是不是指]
      first_person_markers: [我本人, 我这边, 我这里, 我有, 我能, 我可以, 我也能, 我仍然, 我照样, 手上还有]
      contrast_markers: [所以, 但是, 不过, 然而, 可是, 例外]

    # 风险评价语义用于识别“某种行为属于诈骗/违法”一类评论。
    # outcomes.stance 只能使用 warning 或 condemnation；它表达评论者对风险对象的立场。
    risk_evaluation:
      outcomes:
        - stance: warning
          roots: [诈骗, 骗局, 骗术, 陷阱, 套路]
        - stance: condemnation
          roots: [非法, 违法, 违规, 犯罪, 黑产, 灰产]
        - stance: condemnation
          roots: [有害, 危害, 危险, 不道德, 可耻, 缺德]
      outcome_suffixes: [产业链, 产业, 行业, 行为, 活动, 生意, 内容, 问题]
      judgment_predicates: [基本都是, 很可能是, 大概率是, 本质上是, 本质是, 大多是, 往往是, 可能是, 多半是, 基本是, 都属于, 属于, 算是, 构成, 就是, 都是, 是, 这种, 这类]
      demonstrative_predicates: [这种, 这类]
      post_outcome_rejections: [不可信, 不靠谱, 不能信, 不要信, 不要相信, 别信, 应举报, 应该举报, 建议举报, 必须举报]
      warning_predicates: [谨防, 警惕, 小心, 当心, 防范, 远离]
      governance_actions: [严厉打击, 依法打击, 坚决抵制, 主动举报, 禁止, 取缔, 打击, 抵制, 举报, 反对, 谴责, 批判]
      governance_modals: [应当, 应该, 必须, 需要, 要, 建议, 值得]
      promotion_markers: [我这边, 我这里, 我有, 我能, 手上还有, 找我, 给我, 加我, 联系我, 我替你, 我帮你, 本人接, 我的渠道, 我的项目, 我的资源, 可以接, 能够接]
      question_markers: [是不是, 是否, 算不算, 属不属于, 违法吗, 合法吗, 违规吗, 犯罪吗, 是不是骗局]
      promotion_contrast_markers: [但是, 不过, 然而, 可是, 例外]
      promotion_action_markers: [需要, 想要, 可以, 提供, 领取, 私聊, 联系, 加入, 接单]

