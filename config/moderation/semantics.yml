    # 只配置规范语义概念，不维护谐音、错别字和拼音变体映射。
    # 本地候选算法负责从这些概念生成变体，关系分析则要求对象、语气、动作同时成立。
    harmful_value_policy:
      disabled: false
      self_harm_actions: [跳楼, 割腕, 上吊, 服毒, 自杀]
      death_wish_actions: [去死, 别活, 不配活]
      dangerous_actions: [卧轨, 摸高压线, 闯红灯]
      dangerous_substances: [敌敌畏, 百草枯, 农药, 鼠药]
      ingestion_actions: [喝, 吞, 吃, 服, 服用, 灌]
      incitement_markers: [怎么不, 有本事就, 敢不敢, 不如, 就该, 赶紧, 快去, 最好, 希望, 巴不得, 建议, 应该, 去]
      incitement_suffixes: [吧, 算了, 得了, 不是挺好]
      ideation_markers: [想, 想要, 打算, 准备, 不想活, 活不下去, 撑不住]
      prevention_markers: [不要, 别, 请勿, 严禁, 禁止, 防止, 阻止, 劝阻, 救下, 远离, 避免, 担心, 求助, 就医, 报警]
      education_actors: [老师, 学校, 课堂, 上课, 课程, 教材, 文章, 新闻, 警方, 医生, 平台]
      education_actions: [科普, 讲解, 介绍, 了解, 提醒, 警示, 分析, 批判, 揭露, 通报]
      critical_outcomes: [危害, 风险, 有毒, 危险, 违法, 防范, 远离, 抵制, 举报, 打击, 救助, 求助, 就医, 报警]
      # 人称、被指向对象和引用后缀用于区分“我想自伤”“你去自伤”和“自伤事件分析”。
      self_pronouns: [我们, 自己, 本人, 我]
      other_pronouns: [你们, 他们, 她们, 您, 你, 他, 她]
      additional_targets: [同学, 孩子, 家人, 大家, 别人]
      addressed_targets: [你, 您, 你们, 同学, 大家]
      reference_suffixes: [事件, 案例, 新闻, 原因, 现象, 知识, 问题, 话题, 含义]
      outcome_negations: [没有, 并无, 并不, 并非, 不算, 不能算, 不是, 不属于, 谈不上, 无]
      promotion_conflicts: [值得加入, 建议加入, 鼓励加入, 值得支持, 鼓励传播, 建议照做]
